services:
  mongodb:
    image: mongo:6.0
    container_name: softarchitect_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=softarchitect_ai

  backend:
    build: ./backend
    container_name: softarchitect_backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-softarchitect_ai}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:4173"]}
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: softarchitect_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
